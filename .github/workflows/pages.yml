name: Deploy web app

# Publishes the browser version of Sidekick to GitHub Pages on every push to main.
# Only the built app is published (dist/). The Supabase URL and publishable key are public by design;
# access to data is enforced by the database rules, and sign-in is invite-only.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'index.html', 'package*.json', 'vite.config.ts', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install and test
        run: |
          npm ci
          npm test
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
